name: login
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dots_indicator: ^4.0.1
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  provider: ^6.1.5+1
  animate_do: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/svg/
    - assets/font/                                                       
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: NicoMoji
      fonts:
       - asset: assets/font/NicoMoji-Regular.ttf
  